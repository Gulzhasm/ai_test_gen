# AC-coverage baseline for story 270739 — Properties Panel – Design
# Ground truth per evaluation/ANNOTATION_PROTOCOL.md.
# Labels drafted from full step text (ADO, 8 Jul 2026) by AI annotator;
# pending review by the researcher (annotator of record).
# AC4 (Rotation) restored: the June seeding dropped the entire Rotation block
# (numeric −180..+180 field, 90° buttons, mirror buttons). AC count 9 → 10;
# ACs renumbered in source-document order.

story_id: '270739'
difficulty: hard   # composite ACs, instant-update couplings, unit conversion (rubric §4)

acceptance_criteria:
  - id: AC1
    text: "The Design tab is visible only when an object is selected."
    in_scope: true
  - id: AC2
    text: "If nothing is selected, a message 'Select an object to view properties' appears."
    in_scope: true
  - id: AC3
    text: "Coordinates: Latitude/Longitude fields (N/W) allow decimal input; validation required for valid ranges. Tied to 'GPS Input and Mapping' story."
    in_scope: true
  - id: AC4
    text: "Rotation: numeric field for free rotation (−180° to +180°); buttons for 90° rotation left/right and for mirroring horizontally/vertically."
    in_scope: true
  - id: AC5
    text: "Dimensions (W/H): displayed in current units (ft/m or in/cm); fractional values supported."
    in_scope: true
  - id: AC6
    text: "Fill: color picker and opacity slider update the object instantly."
    in_scope: true
  - id: AC7
    text: "Stroke: color picker and Weight (thickness) field update the object instantly."
    in_scope: true
  - id: AC8
    text: "All edits support Undo/Redo."
    in_scope: true
  - id: AC9
    text: "Unit or Scale changes automatically update displayed units without changing real-world size."
    in_scope: true
  - id: AC10
    text: "Must comply with Section 508 / WCAG 2.1 AA accessibility standards (focus, color contrast, visible labels). Out of scope (Phase 1): tooltips and hotkeys."
    in_scope: true

test_labels:
