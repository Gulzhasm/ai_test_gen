    title: "270739-AC1: Properties Panel – Design / Properties Panel / Design Tab Visibility"
    covers: [AC1]
    confidence: high
    note: "Tab appears on selection; final step lists all sections (incl. Rotation) — presence-level surface of AC3–AC7."
  - test_id: '270739-005'
    title: "270739-005: Properties Panel – Design / Properties Panel / Design Tab Hidden When No Object Selected"
    covers: [AC1, AC2]
    confidence: high
  - test_id: '270739-010'
    title: "270739-010: Properties Panel – Design / Properties Panel / Design Tab Hides On Deselection"
    covers: [AC1, AC2]
    confidence: high
    note: "Deselection state-variation (rule 6)."
