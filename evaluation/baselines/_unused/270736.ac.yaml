# AC-coverage baseline for story 270736
# ACs (12) and tests (24) seeded from Azure DevOps.
# For each test below, set covers: [AC1, ...] — the AC id(s) it ACTUALLY tests.
# Leave covers: [] for a spurious / hallucinated / out-of-scope test.

story_id: '270736'

acceptance_criteria:
  - id: AC1
    text: "Tool available under Dimensions → Set Scale (reference line)."
    in_scope: true
  - id: AC2
    text: "User c licks the first known point on the Canvas and moves the mouse to second point — a temporary line appears between them."
    in_scope: true
  - id: AC3
    text: "System opens a dialog to enter a numeric value (decimals allowed) and select unit (ft/m)."
    in_scope: true
  - id: AC4
    text: "After confirmation, the app calculates and applies the scale so the reference line matches the entered real distance."
    in_scope: true
  - id: AC5
    text: "Zoom level and visual appearance stay unchanged – only measurement logic updates."
    in_scope: true
  - id: AC6
    text: "Rulers, coordinates, and dimensions instantly reflect the new scale."
    in_scope: true
  - id: AC7
    text: "Bottom Bar shows the updated scale (e.g., 1″ = 40 ft / 1 cm = 2 m)."
    in_scope: true
  - id: AC8
    text: "Scale is saved and displayed correctly on PDF exports."
    in_scope: true
  - id: AC9
    text: "The input field accepts only numeric values (digits, decimal point, or comma) and does not allow zero, according to the defined minimum values for the selected metric or imperial unit system."
    in_scope: true
  - id: AC10
    text: "Action is Undo/Redo supported."
    in_scope: true
  - id: AC11
    text: "Must comply with Section 508 / WCAG 2.1 AA accessibility and UI standards (visible focus indicators, readable dialog text, clear error messages)."
    in_scope: true
  - id: AC12
    text: "The system shall validate minimum and maximum scale values based on the selected measurement units."
    in_scope: true

