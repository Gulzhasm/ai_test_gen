# AC-coverage baseline for story 270737
# ACs (8) and tests (33) seeded from Azure DevOps.
# For each test below, set covers: [AC1, ...] — the AC id(s) it ACTUALLY tests.
# Leave covers: [] for a spurious / hallucinated / out-of-scope test.

story_id: '270737'

acceptance_criteria:
  - id: AC1
    text: "Tool available under Set Coordinates tool from the Tools dropdown in the top menu ."
    in_scope: true
  - id: AC2
    text: "System supports manual entry of Latitude and Longitude in decimal format (e.g., 48.12345, -123.98765)."
    in_scope: true
  - id: AC3
    text: "Invalid or incomplete coordinates (e.g., letters or out-of-range values) trigger a clear validation error."
    in_scope: true
  - id: AC4
    text: "Zoom or scale changes do not alter GPS coordinate values."
    in_scope: true
  - id: AC5
    text: "Undo/Redo fully supported for coordinate edits."
    in_scope: true
  - id: AC6
    text: "When an user zooms out or zooms in, the GPS text needs to reflect accordingly, it has to get smaller or bigger"
    in_scope: true
  - id: AC7
    text: "Must comply with Section 508 / WCAG 2.1 AA accessibility and UI standards (visible input focus, high-contrast labels, readable dialog text)."
    in_scope: true
  - id: AC8
    text: "[OUT OF SCOPE] The GPS dialog includes an “Align to North” option with two radio buttons: Auto — system aligns the drawing orientation to geographic north based on the entered coordinates. Manual — user sets north orientation manually (linked to Compass tool). Selected alignment mode is saved per drawing and remains consistent across sessions. If Auto is selected, north alignment is applied immediately after coordinates are entered."
    in_scope: true

