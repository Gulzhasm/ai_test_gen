story_id: '269903'

acceptance_criteria:
  - id: AC1
    text: "Bottom Bar displays two coordinate fields labeled X and Y."
    in_scope: true
  - id: AC2
    text: "Coordinate values update in real time as the cursor moves across the Canvas."
    in_scope: true
  - id: AC3
    text: "When an object is selected, the coordinates of the cursor are still displayed."
    in_scope: true
  - id: AC4
    text: "Coordinate values reflect the current scale and measurement units (e.g., ft, m)."
    in_scope: true
  - id: AC5
    text: "Coordinate display is read-only; users cannot edit values directly."
    in_scope: true
  - id: AC6
    text: "Must comply with Section 508 and WCAG 2.1 AA accessibility standards."
    in_scope: true

