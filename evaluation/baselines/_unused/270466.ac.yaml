# AC-coverage baseline for story 270466
# ACs (9) and tests (18) seeded from Azure DevOps.
# For each test below, set covers: [AC1, ...] — the AC id(s) it ACTUALLY tests.
# Leave covers: [] for a spurious / hallucinated / out-of-scope test.

story_id: '270466'

acceptance_criteria:
  - id: AC1
    text: "The Select & Move Tool is available from the Left Toolbar."
    in_scope: true
  - id: AC2
    text: "When active: The cursor looks like an arrow (selection mode)."
    in_scope: true
  - id: AC3
    text: "Clicking an object selects it."
    in_scope: true
  - id: AC4
    text: "Clicking and dragging moves the selected object on the Canvas."
    in_scope: true
  - id: AC5
    text: "Clicking and dragging on empty space creates a selection box for multiple objects."
    in_scope: true
  - id: AC6
    text: "Movement is limited to the visible Canvas area."
    in_scope: true
  - id: AC7
    text: "All actions can be undone or redone with Undo / Redo."
    in_scope: true
  - id: AC8
    text: "The tool remains active until another drawing tool is selected."
    in_scope: true
  - id: AC9
    text: "Must comply with Section 508 and WCAG 2.1 AA accessibility standards. (Hotkeys and tooltips are out of scope for Phase 1.)"
    in_scope: true

