story_id: '283737'

acceptance_criteria:
  - id: AC1
    text: "Deep Link Configuration"
    in_scope: true
  - id: AC2
    text: "Android application registers the deep link callback URI: cdp-quickdraw://auth/callback"
    in_scope: true
  - id: AC3
    text: "The Android system recognizes this URI and routes it to the QuickDraw application. Browser Authentication Flow"
    in_scope: true
  - id: AC4
    text: "When the user initiates login, QuickDraw opens the system browser."
    in_scope: true
  - id: AC5
    text: "The browser redirects the user to CDP IdentityServer for authentication. Authentication Callback Handling"
    in_scope: true
  - id: AC6
    text: "After successful authentication, IdentityServer redirects the browser to the deep link: cdp-quickdraw://auth/callback"
    in_scope: true
  - id: AC7
    text: "Android routes the deep link back to the QuickDraw application."
    in_scope: true
  - id: AC8
    text: "QuickDraw receives the authentication response and forwards the token to the shared MAUI authentication service. Application State Handling"
    in_scope: true
  - id: AC9
    text: "If the QuickDraw application is already running, the authentication response is delivered to the active application instance."
    in_scope: true
  - id: AC10
    text: "If the application is not active, the system launches QuickDraw and processes the authentication response. Authentication Cancellation"
    in_scope: true
  - id: AC11
    text: "If the user cancels authentication in the browser, QuickDraw returns to the unauthenticated state. Authentication Error Handling"
    in_scope: true
  - id: AC12
    text: "If the authentication callback cannot be processed, the system displays the message: 'Sign-in could not be completed. Please try again.'"
    in_scope: true
  - id: AC13
    text: "The user can retry the login process."
    in_scope: true
  - id: AC14
    text: "Authentication tokens and sensitive authentication data must not be written to logs."
    in_scope: true
  - id: AC15
    text: "Authentication responses must only be accepted from the registered deep link callback. QA Validation Scope QA should be able to validate:"
    in_scope: true
  - id: AC16
    text: "Android login flow using system browser"
    in_scope: true
  - id: AC17
    text: "deep link redirect from IdentityServer to the application"
    in_scope: true
  - id: AC18
    text: "authentication response successfully processed by QuickDraw"
    in_scope: true
  - id: AC19
    text: "application receives callback when already running"
    in_scope: true
  - id: AC20
    text: "application launches and processes callback when not running"
    in_scope: true
  - id: AC21
    text: "login cancellation returns user to unauthenticated state"
    in_scope: true
  - id: AC22
    text: "authentication errors show retry message"
    in_scope: true
  - id: AC23
    text: "tokens are not written to logs User Experience and Error Handling Browser opens automatically and is brought to foreground on app launch “Completing Sign In” dialog is displayed with loading indicator Dialog text: “A browser window has been opened to complete your sign-in” “Please complete authentication in the browser. This window will close automatically once sign-in is complete.” “Open Sign-In Page” button reopens authentication if browser was closed On success, browser shows: “Authentication Successful” “You can close this window and return to CDP SiteDraft” On failure, dialog shows: “Access Denied” “Your account does not currently have access to SiteDraft. Please contact your administrator or support.” “Access Denied” dialog includes: “Contact Support” “Sign in with a different account” No detailed error information is exposed"
    in_scope: true

