# AC-coverage baseline for story 272776
# ACs (10) and tests (11) seeded from Azure DevOps.
# For each test below, set covers: [AC1, ...] — the AC id(s) it ACTUALLY tests.
# Leave covers: [] for a spurious / hallucinated / out-of-scope test.

story_id: '272776'

acceptance_criteria:
  - id: AC1
    text: "When hidden, all sections within the Property Panel (Design, Layers, History) are hidden together."
    in_scope: true
  - id: AC2
    text: "The Window menu must include an option to show or hide the Property Panel."
    in_scope: true
  - id: AC3
    text: "Clicking the Property Panel option in the Window menu must show or hide the entire Property Panel."
    in_scope: true
  - id: AC4
    text: "When the Property Panel is hidden, it must not occupy space in the interface layout."
    in_scope: true
  - id: AC5
    text: "When the Property Panel is shown, it must appear in its designated UI position."
    in_scope: true
  - id: AC6
    text: "The Design Panel, Layers Panel, and History Panel must appear together as part of the Property Panel."
    in_scope: true
  - id: AC7
    text: "Individual show/hide controls for Design, Layers, or History panels are not supported in this implementation."
    in_scope: true
  - id: AC8
    text: "All behavior must comply with the specifications and details described in the User Story."
    in_scope: true
  - id: AC9
    text: "Must comply with Section 508 and WCAG 2.1 AA accessibility standards (color contrast, focus order, readable text)."
    in_scope: true
  - id: AC10
    text: "Hotkeys and tooltips are out of scope for Phase 1."
    in_scope: true

