# AC-coverage baseline for story 270480
# ACs (15) and tests (24) seeded from Azure DevOps.
# For each test below, set covers: [AC1, ...] — the AC id(s) it ACTUALLY tests.
# Leave covers: [] for a spurious / hallucinated / out-of-scope test.

story_id: '270480'

acceptance_criteria:
  - id: AC1
    text: "Acceptance Criteria: Pen Tool:"
    in_scope: true
  - id: AC2
    text: "Activated from Draw → Pen Tool."
    in_scope: true
  - id: AC3
    text: "Cursor changes to a pen icon."
    in_scope: true
  - id: AC4
    text: "User clicks to add points; each new point connects with a straight line segment."
    in_scope: true
  - id: AC5
    text: "Double-click or pressing Enter finalizes the shape."
    in_scope: true
  - id: AC6
    text: "The created shape can be selected, moved, deleted, and undone/redone. Pencil Tool:"
    in_scope: true
  - id: AC7
    text: "Activated from Draw → Pencil Tool."
    in_scope: true
  - id: AC8
    text: "Cursor changes to a pencil icon (or crosshair)."
    in_scope: true
  - id: AC9
    text: "User drags mouse or stylus to draw a smooth, continuous line that follows motion in real time."
    in_scope: true
  - id: AC10
    text: "The line finalizes automatically when mouse/stylus is released."
    in_scope: true
  - id: AC11
    text: "The drawn line can be selected, moved, deleted, and undone/redone. General Behavior:"
    in_scope: true
  - id: AC12
    text: "Default stroke color, thickness, and style apply."
    in_scope: true
  - id: AC13
    text: "Both tools support mouse and stylus input."
    in_scope: true
  - id: AC14
    text: "Tool remains active until another tool is selected."
    in_scope: true
  - id: AC15
    text: "Accessibility (Phase 1):"
    in_scope: true

