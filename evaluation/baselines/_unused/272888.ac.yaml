# AC-coverage baseline for story 272888
# ACs (11) and tests (16) seeded from Azure DevOps.
# For each test below, set covers: [AC1, ...] — the AC id(s) it ACTUALLY tests.
# Leave covers: [] for a spurious / hallucinated / out-of-scope test.

story_id: '272888'

acceptance_criteria:
  - id: AC1
    text: "Draw Order submenu is accessible under Tools → Draw Order."
    in_scope: true
  - id: AC2
    text: "All four actions are visible: Bring to Front, Send to Back, Bring Above Objects, Send Under Objects."
    in_scope: true
  - id: AC3
    text: "A Draw Order option becomes active only when at least one object is selected."
    in_scope: true
  - id: AC4
    text: "Bring to Front places the selected object(s) at the highest z-index above all other objects."
    in_scope: true
  - id: AC5
    text: "Send to Back places the selected object(s) at the lowest z-index."
    in_scope: true
  - id: AC6
    text: "Bring Above Objects increases the z-index by one level."
    in_scope: true
  - id: AC7
    text: "Send Under Objects decreases the z-index by one level."
    in_scope: true
  - id: AC8
    text: "Multi-selected objects retain their relative order when moved."
    in_scope: true
  - id: AC9
    text: "Changes in stacking order appear immediately on the Canvas."
    in_scope: true
  - id: AC10
    text: "Undo/Redo supports all Draw Order actions."
    in_scope: true
  - id: AC11
    text: "Must comply with Section 508 and WCAG 2.1 AA accessibility standards (color contrast, focus order, readable text)."
    in_scope: true

