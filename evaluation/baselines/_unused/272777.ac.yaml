# AC-coverage baseline for story 272777
# ACs (8) and tests (19) seeded from Azure DevOps.
# For each test below, set covers: [AC1, ...] — the AC id(s) it ACTUALLY tests.
# Leave covers: [] for a spurious / hallucinated / out-of-scope test.

story_id: '272777'

acceptance_criteria:
  - id: AC1
    text: "Tool is available under Draw → Measurement Line."
    in_scope: true
  - id: AC2
    text: "User clicks once on the Canvas to set the starting point of the measurement. While the mouse is held and moved, a preview line follows the cursor. When the user releases the mouse button, the measurement line (straight or angled) is created."
    in_scope: true
  - id: AC3
    text: "System displays the measured distance between the two selected points using the active Unit System (Imperial/Metric)."
    in_scope: true
  - id: AC4
    text: "A distance label appears after the second point is selected."
    in_scope: true
  - id: AC5
    text: "User can reposition the label anywhere on the Canvas - not in scope for this story, see Important section in the description."
    in_scope: true
  - id: AC6
    text: "User can adjust the label’s font size through the Properties panel - not in scope for this story, see Important section in the description."
    in_scope: true
  - id: AC7
    text: "Undo/Redo is supported for placing or moving the label."
    in_scope: true
  - id: AC8
    text: "Must comply with Section 508 / WCAG 2.1 AA accessibility standards (readable text, keyboard focus, clear contrast)."
    in_scope: true

