# AC-coverage baseline for story 270033
# ACs (8) and tests (15) seeded from Azure DevOps.
# For each test below, set covers: [AC1, ...] — the AC id(s) it ACTUALLY tests.
# Leave covers: [] for a spurious / hallucinated / out-of-scope test.

story_id: '270033'

acceptance_criteria:
  - id: AC1
    text: "A Compass (North Indicator) is displayed within the Canvas by default (top-right corner)."
    in_scope: true
  - id: AC2
    text: "The compass shows the North direction visually (arrow or “N” marker)."
    in_scope: true
  - id: AC3
    text: "Users can move the compass anywhere within the Canvas by dragging."
    in_scope: true
  - id: AC4
    text: "Users can rotate the compass freely by dragging or by entering an exact angle value (e.g., 37°)."
    in_scope: true
  - id: AC5
    text: "The compass is always visible and cannot be toggled off."
    in_scope: true
  - id: AC6
    text: "The compass appears on all PDF and image exports, preserving its position, size, and orientation."
    in_scope: true
  - id: AC7
    text: "Rotation affects only the compass, not the drawing itself (drawing image does not rotate)."
    in_scope: true
  - id: AC8
    text: "Must comply with Section 508 and WCAG 2.1 AA accessibility standards (color contrast, focus order, readable text). Hotkeys and tooltips are out of scope for Phase 1."
    in_scope: true

