# AC-coverage baseline for story 272575
# ACs (7) and tests (15) seeded from Azure DevOps.
# For each test below, set covers: [AC1, ...] — the AC id(s) it ACTUALLY tests.
# Leave covers: [] for a spurious / hallucinated / out-of-scope test.

story_id: '272575'

acceptance_criteria:
  - id: AC1
    text: "Live distance tooltip appears while drawing with Line or Pen Tool."
    in_scope: true
  - id: AC2
    text: "Tooltip updates continuously as the cursor moves."
    in_scope: true
  - id: AC3
    text: "Measurement uses active Scale Ratio and Regional Format (Imperial/Metric)."
    in_scope: true
  - id: AC4
    text: "After the segment is created, user can enable/disable Show Length Label."
    in_scope: true
  - id: AC5
    text: "Length label updates automatically if endpoints move or if Scale/Units change."
    in_scope: true
  - id: AC6
    text: "Tooltip is only visible during the drawing process, and it can be toggled on/off via the Properties panel"
    in_scope: true
  - id: AC7
    text: "Expected behavior includes all details defined throughout the User Story."
    in_scope: true

