# AC-coverage baseline for story 273566
# ACs (6) and tests (12) seeded from Azure DevOps.
# For each test below, set covers: [AC1, ...] — the AC id(s) it ACTUALLY tests.
# Leave covers: [] for a spurious / hallucinated / out-of-scope test.

story_id: '273566'

acceptance_criteria:
  - id: AC1
    text: "Objects with measurements can display multiple labels."
    in_scope: true
  - id: AC2
    text: "Labels can be repositioned inside or near the object boundary."
    in_scope: true
  - id: AC3
    text: "Repositioning helps avoid label overlapping."
    in_scope: true
  - id: AC4
    text: "Geometric meaning is preserved (e.g. radius and diameter remain close to the related geometry)."
    in_scope: true
  - id: AC5
    text: "Label visibility and position can be controlled via the Properties panel."
    in_scope: true
  - id: AC6
    text: "Label repositioning applies only to supported measurement labels. Note: Minor visual overlap between the label and the object border is allowed and considered acceptable behavior."
    in_scope: true

