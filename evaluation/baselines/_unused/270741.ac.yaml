# AC-coverage baseline for story 270741
# ACs (8) and tests (13) seeded from Azure DevOps.
# For each test below, set covers: [AC1, ...] — the AC id(s) it ACTUALLY tests.
# Leave covers: [] for a spurious / hallucinated / out-of-scope test.

story_id: '270741'

acceptance_criteria:
  - id: AC1
    text: "The history panel is available as a tab within the right sidebar, alongside Design and Layers, and can be accessed by selecting the “History” tab."
    in_scope: true
  - id: AC2
    text: "System logs all user actions that modify the Canvas"
    in_scope: true
  - id: AC3
    text: "Most recent actions appear at the top."
    in_scope: true
  - id: AC4
    text: "The history panel supports the selection of individual steps and allows the deletion of selected entries via the delete action."
    in_scope: true
  - id: AC5
    text: "The panel refreshes dynamically when a new action occurs."
    in_scope: true
  - id: AC6
    text: "History resets when a new drawing is created"
    in_scope: true
  - id: AC7
    text: "Panel supports scrolling when the list exceeds the visible height."
    in_scope: true
  - id: AC8
    text: "Must comply with Section 508 / WCAG 2.1 AA accessibility standards (keyboard navigation, visible focus, readable labels)."
    in_scope: true

