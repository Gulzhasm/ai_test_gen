story_id: '273166'

acceptance_criteria:
  - id: AC1
    text: "Typography section is visible only when a text object is selected."
    in_scope: true
  - id: AC2
    text: "All controls appear as shown in the UI (dropdowns + toggle buttons)."
    in_scope: true
  - id: AC3
    text: "Changing any control updates the selected text object immediately."
    in_scope: true
  - id: AC4
    text: "Font, style, size, alignment, decoration, case, and list style work independently."
    in_scope: true
  - id: AC5
    text: "Default typography settings apply when creating a new text object."
    in_scope: true
  - id: AC6
    text: "No controls appear for non-text objects."
    in_scope: true
  - id: AC7
    text: "No manual text size entry in Phase 1 (dropdown only)."
    in_scope: true

