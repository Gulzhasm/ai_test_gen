# AC-coverage baseline for story 270740
# ACs (12) and tests (30) seeded from Azure DevOps.
# For each test below, set covers: [AC1, ...] — the AC id(s) it ACTUALLY tests.
# Leave covers: [] for a spurious / hallucinated / out-of-scope test.

story_id: '270740'

acceptance_criteria:
  - id: AC1
    text: "The Layers Panel is available on the right sidebar for every open drawing."
    in_scope: true
  - id: AC2
    text: "All objects on the Canvas appear as rows in the list."
    in_scope: true
  - id: AC3
    text: "Each row includes:"
    in_scope: true
  - id: AC4
    text: "Selection synchronization:"
    in_scope: true
  - id: AC5
    text: "Hidden objects are not visible or selectable on the Canvas."
    in_scope: true
  - id: AC6
    text: "Locked objects cannot be moved or edited until unlocked."
    in_scope: true
  - id: AC7
    text: "Object names update immediately when renamed (validation: non-empty, max length 100)."
    in_scope: true
  - id: AC8
    text: "Changing order updates the visual stacking on the Canvas (front/back) ."
    in_scope: true
  - id: AC9
    text: "Deleted objects are fully removed from both Canvas and the list after confirmation."
    in_scope: true
  - id: AC10
    text: "All layer states (visibility, lock, order, name) persist within the saved drawing file."
    in_scope: true
  - id: AC11
    text: "Undo/Redo applies to rename, visibility, lock, order, and delete actions (limit 50)."
    in_scope: true
  - id: AC12
    text: "Must comply with Section 508 / WCAG 2.1 AA (focus indicators, keyboard navigation, accessible labels)."
    in_scope: true

