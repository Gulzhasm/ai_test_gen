story_id: '272779'

acceptance_criteria:
  - id: AC1
    text: "The tool is available under Dimensions → Radius."
    in_scope: true
  - id: AC2
    text: "An ellipse is selected and the user chooses Dimensions → Radius or enables the corresponding toggle in the Properties – Design panel, the system automatically calculates the radius."
    in_scope: true
  - id: AC3
    text: "The user can reposition the radius label - This AC is cancelled - 'According to our latest (12/16/2025) discussion radius and diameter measurements cannot be manually repositioned on the canvas. Their placement is defined by geometric rules and standards, ensuring correct and unambiguous representation. Allowing free repositioning could break geometric accuracy and lead to incorrect interpretation. '"
    in_scope: true
  - id: AC4
    text: "Undo/Redo is supported for adding, moving, or removing the radius measurement."
    in_scope: true
  - id: AC5
    text: "Must comply with Section 508 / WCAG 2.1 AA (readable text, sufficient contrast, keyboard accessibility)."
    in_scope: true

