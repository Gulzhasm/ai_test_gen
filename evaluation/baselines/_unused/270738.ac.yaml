# AC-coverage baseline for story 270738
# ACs (10) and tests (33) seeded from Azure DevOps.
# For each test below, set covers: [AC1, ...] — the AC id(s) it ACTUALLY tests.
# Leave covers: [] for a spurious / hallucinated / out-of-scope test.

story_id: '270738'

acceptance_criteria:
  - id: AC1
    text: "Undo/Redo functionality is available globally across the Drawing App."
    in_scope: true
  - id: AC2
    text: "Each user action is added to the Undo stack."
    in_scope: true
  - id: AC3
    text: "Actions include, but are not limited to: • Object creation (shapes, lines, annotations) • Object modification (move, rotate, mirror, resize) • Canvas edits (add/delete elements) • Measurement and scale adjustments • Text or annotation edits"
    in_scope: true
  - id: AC4
    text: "Buttons are visible and active in both: • Top Action Toolbar • Edit Menu (“Undo [Action Name]”, “Redo [Action Name]”)"
    in_scope: true
  - id: AC5
    text: "Keyboard shortcuts supported: • Ctrl + Z → Undo • Ctrl + Y / Ctrl + Shift + Z → Redo"
    in_scope: true
  - id: AC6
    text: "Performing a new action clears the Redo history."
    in_scope: true
  - id: AC7
    text: "Undo/Redo stacks are reset when a new drawing is opened."
    in_scope: true
  - id: AC8
    text: "Application remembers the Undo limit."
    in_scope: true
  - id: AC9
    text: "Disabled button state shown when no further undo or redo is available."
    in_scope: true
  - id: AC10
    text: "Must comply with Section 508 / WCAG 2.1 AA standards (focus indicators, contrast, button labels). Tooltips and hotkey hints remain out of scope for Phase 1."
    in_scope: true

