# AC-coverage baseline for story 269899
# ACs (8) and tests (28) seeded from Azure DevOps.
# For each test below, set covers: [AC1, ...] — the AC id(s) it ACTUALLY tests.
# Leave covers: [] for a spurious / hallucinated / out-of-scope test.

story_id: '269899'

acceptance_criteria:
  - id: AC1
    text: "Top Toolbar includes Zoom In and Zoom Out buttons; each click changes zoom by 10 % within limits (10 %–400 %)."
    in_scope: true
  - id: AC2
    text: "Bottom Bar displays the current zoom percentage (e.g., 100 %) [and allows manual entry manual entry is out of scope and will be implemented during Phase 2 in a separate user story ] or selection from presets: 50 %-400 % with a step of 10%."
    in_scope: true
  - id: AC3
    text: "Mouse and keyboard controls (this functionality is moved to a separate US - User Story 270457 Zoom Controls (Keyboard & Mouse) )"
    in_scope: true
  - id: AC4
    text: "Changing zoom through any control (Toolbar, Bottom Bar, mouse, or keyboard) updates all other zoom indicators instantly."
    in_scope: true
  - id: AC5
    text: "Zoom affects only the view of the drawing; it does not change the actual scale or object dimensions."
    in_scope: true
  - id: AC6
    text: "Zoom level stays the same while the drawing tab is open (resets to 100% when reopened)."
    in_scope: true
  - id: AC7
    text: "All zoom controls are keyboard-accessible and include tooltips (this functionality is moved to a separate US) - User Story 270457 Zoom Controls (Keyboard & Mouse)"
    in_scope: true
  - id: AC8
    text: "Must follow accessibility and UI compliance standards (508 / WCAG)"
    in_scope: true

