# AC-coverage baseline for story 270471
# ACs (7) and tests (41) seeded from Azure DevOps.
# For each test below, set covers: [AC1, ...] — the AC id(s) it ACTUALLY tests.
# Leave covers: [] for a spurious / hallucinated / out-of-scope test.

story_id: '270471'

acceptance_criteria:
  - id: AC1
    text: "Acceptance Criteria: When active:"
    in_scope: true
  - id: AC2
    text: "A small rotation marker appears near the selected object. Exception: for line objects, the rotation marker is not displayed; the user rotates the line by dragging either endpoint."
    in_scope: true
  - id: AC3
    text: "The user can click and drag this marker to turn the object in any direction (0–360°)."
    in_scope: true
  - id: AC4
    text: "Holding Shift locks rotation to 15° steps for precise alignment.- [Out of scope for Phase 1: hotkeys and tooltips.]"
    in_scope: true
  - id: AC5
    text: "Rotation affects only the selected object and does not change the overall Canvas layout. Accessibility (Phase 1):"
    in_scope: true
  - id: AC6
    text: "Must comply with Section 508 / WCAG 2.1 AA baseline standards (visible focus, sufficient contrast, ARIA label for toolbar button)."
    in_scope: true
  - id: AC7
    text: "Out of scope for Phase 1: hotkeys and tooltips."
    in_scope: true

