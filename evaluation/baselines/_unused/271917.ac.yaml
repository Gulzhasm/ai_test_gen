    text: "Accessibility (Phase 1): Must comply with Section 508 / WCAG 2.1 AA baseline standards (focus indicator, visible feedback, ARIA labels for toolbar buttons). Out of scope for Phase 1: hotkeys and tooltips."
    in_scope: true

