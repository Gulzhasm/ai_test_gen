# AC-coverage baseline for story 270472 — Mirror Tool
# Ground truth per evaluation/ANNOTATION_PROTOCOL.md.
# Labels drafted from full step text (ADO, 8 Jul 2026) by AI annotator;
# pending review by the researcher (annotator of record).
# AC3/AC4/AC5 restored: the June seeding dropped these top-level requirements
# ("appears instantly", "proportions unchanged", "flipped in place") when the
# nested H/V sub-list flattened. AC count 6 → 9.

story_id: '270472'
difficulty: medium   # single transform tool, bounded behaviours (rubric §4)

acceptance_criteria:
  - id: AC1
    text: "'Mirror Tool' can be activated from the Tools Menu → Mirror Horizontally or Mirror Vertically."
    in_scope: true
  - id: AC2
    text: "When activated, the user can flip the selected object: horizontally by selecting Mirror Horizontally, or vertically by selecting Mirror Vertically, from the Tools Menu."
    in_scope: true
  - id: AC3
    text: "The mirrored result appears instantly on the Canvas."
    in_scope: true
  - id: AC4
    text: "The object's proportions remain unchanged."
    in_scope: true
  - id: AC5
    text: "The mirrored object maintains its relative position on the Canvas (flipped in place)."
    in_scope: true
  - id: AC6
    text: "Mirroring affects only the selected object, not the overall Canvas layout."
    in_scope: true
  - id: AC7
    text: "The operation is undoable via Undo/Redo."
    in_scope: true
  - id: AC8
    text: "To mirror another object, the user must select that object and choose Mirror Horizontally or Mirror Vertically again from the Tools Menu."
    in_scope: true
  - id: AC9
    text: "Accessibility (Phase 1): must comply with Section 508 / WCAG 2.1 AA baseline standards (contrast, focus, ARIA role for toolbar buttons). Out of scope for Phase 1: hotkeys and tooltips."
    in_scope: true

test_labels:
  - test_id: '270472-AC1'
    title: "270472-AC1: Mirror Tool / Tools Menu / Horizontal Mirror Applied To Selected Object"
    covers: [AC1, AC2, AC4]
    confidence: high
    note: "Activation via menu (AC1), horizontal flip of selection (AC2), bounding box/size unchanged (AC4)."
  - test_id: '270472-005'
    title: "270472-005: Mirror Tool / Tools Menu / Horizontal Mirror Option Available"
    covers: [AC1, AC2]
    confidence: high
  - test_id: '270472-010'
    title: "270472-010: Mirror Tool / Tools Menu / Vertical Mirror Option Available"
    covers: [AC1, AC2]
    confidence: high
  - test_id: '270472-015'
    title: "270472-015: Mirror Tool / Behavior / Mirror Applies Immediately On Canvas"
    covers: [AC3]
    confidence: high
    note: "Asserts instant result, no spinner/dialog/delay."
  - test_id: '270472-020'
    title: "270472-020: Mirror Tool / Geometry / Mirrored Object Retains Dimensions And Proportions"
    covers: [AC4]
    confidence: high
  - test_id: '270472-025'
    title: "270472-025: Mirror Tool / Geometry / Mirrored Object Flips In Place"
    covers: [AC5]
    confidence: high
    note: "Position asserted unchanged (X=100, Y=100) after mirror."
  - test_id: '270472-030'
    title: "270472-030: Mirror Tool / Scope / Only Selected Object Is Mirrored"
    covers: [AC6]
    confidence: high
  - test_id: '270472-040'
    title: "270472-040: Mirror Tool / Edit Menu / Undo Horizontal Mirror Operation"
    covers: [AC7]
    confidence: high
  - test_id: '270472-045'
    title: "270472-045: Mirror Tool / Edit Menu / Undo Vertical Mirror Operation"
    covers: [AC7]
    confidence: high
  - test_id: '270472-050'
    title: "270472-050: Mirror Tool / Tool State / Mirror Horizontal and Vertical Commands Are Applied Per Use and Do Not Persist as Active Tools"
    covers: [AC8]
    confidence: high
    note: "Asserts per-use command semantics: re-selection + re-invocation required for second object."
  - test_id: '270472-055'
    title: "270472-055: Mirror Tool / Selection / Mirror Options Disabled Without Selection"
    covers: [AC2]
    confidence: medium
    note: "No-selection boundary of AC2's 'selected object' precondition (rule 5); disabled-state itself is specified in no AC."
  - test_id: '270472-060'
    title: "270472-060: Mirror Tool / Double Mirror / Horizontal Double Mirror Restores Original"
    covers: [AC2]
    confidence: medium
    note: "Repeated application of the specified operation (rule 5): involution property."
  - test_id: '270472-065'
    title: "270472-065: Mirror Tool / Combined Mirror / Horizontal Then Vertical Mirror"
    covers: [AC2, AC4, AC5]
    confidence: medium
    note: "Combined H+V application; central assertion includes no distortion (AC4) and no position shift (AC5)."
  - test_id: '270472-070'
    title: "270472-070: Mirror Tool / Empty Canvas / Mirror Tool Behavior On Empty Canvas"
    covers: [AC1]
    confidence: medium
    note: "Empty-canvas boundary of activation (rule 5); asserts disabled/feedback + no crash."
  - test_id: '270472-075'
