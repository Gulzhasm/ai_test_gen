story_id: '270479'
difficulty: hard   # three tools × modes × constraints × scale/coordinate coupling (rubric §4)

acceptance_criteria:
  - id: AC1
    text: "Shape Tools are available from both: Left Toolbar (icons for Line, Rectangle, Circle) and Top Menu → Draw (corresponding text options)."
    in_scope: true
  - id: AC2
    text: "When a Shape Tool is active: cursor changes to a crosshair indicating drawing mode; user clicks and drags on the Canvas to draw the shape; a live preview outline appears during drawing; shape placement finalizes on mouse release."
    in_scope: true
  - id: AC3
    text: "Line Tool: draws a straight line between two points."
    in_scope: true
  - id: AC4
    text: "Rectangle Tool: defines two corners; holding Shift creates a square."
    in_scope: true
  - id: AC5
    text: "Circle Tool: draws from center outward; holding Shift constrains to perfect circle."
    in_scope: true
  - id: AC6
    text: "Each shape obeys the current scale and coordinate system."
    in_scope: true
  - id: AC7
    text: "All drawn shapes can be selected, moved, deleted, and undone/redone."
    in_scope: true
  - id: AC8
    text: "Tool remains active until another tool is selected."
    in_scope: true
  - id: AC9
    text: "Accessibility (Phase 1): must comply with Section 508 / WCAG 2.1 AA baseline standards (focus indicator, visible feedback, ARIA labels for toolbar buttons). Out of scope for Phase 1: hotkeys and tooltips."
    in_scope: true

