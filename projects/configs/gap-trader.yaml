# Gap Forecaster - pre-market gap scanner, trade journal, and stats dashboard
# Serves as dissertation test bed for AI-generated test automation (Playwright + Postman).
# Reconciled to the actual app: github.com/Gulzhasm/gap-trading-forecaster
#   - Next.js frontend on http://localhost:3000
#   - FastAPI backend on http://localhost:8000 (mocked at the network layer during UI extraction)
#   - Three client-side tabs: Scanner / Journal / Stats (no per-tab routes)

project_id: gap-trader

# Platform selection
source_platform: ado
target_platform: ado

application:
  name: Gap Forecaster
  description: Pre-market gap scanner, trade journal, and performance stats web dashboard
  type: web
  base_url: http://localhost:3000

  # Step templates (web app pattern)
  prereq_template: "Pre-req: User has a web browser open and navigated to {app_name}"
  launch_step: "Navigate to the {app_name} application at http://localhost:3000."
  launch_expected: "The dashboard loads with the Scanner tab and pre-market scan visible."
  close_step: "Close the browser tab for {app_name}."

  # UI surfaces (actual app structure)
  ui_surfaces:
    - Header
    - Scanner Tab
    - Journal Tab
    - Stats Tab
    - Scan Button
    - Top Pick Card
    - Scanner Results Table
    - Trade Journal Table
    - Stats Cards

  # Entry point mappings (feature keyword -> UI surface)
  entry_point_mappings:
    scan: Scanner Tab
    gap: Scanner Tab
    forecast: Scanner Tab
    top pick: Scanner Tab
    p(fill): Scanner Tab
    catalyst: Scanner Tab
    journal: Journal Tab
    trade: Journal Tab
    closed trade: Journal Tab
    stats: Stats Tab
    win rate: Stats Tab
    net p/l: Stats Tab
    profit factor: Stats Tab
    avg r: Stats Tab
    equity: Header
    day p/l: Header

  # Supported platforms (browsers for web app)
  platforms:
    - Chrome
    - Firefox
    - Safari
    - Edge

  # Features NOT available in this app
  unavailable_features:
    - user authentication
    - multi-user
    - options trading
    - mobile app
    - dark mode toggle
    - offline mode
    - watchlist editing
    - order placement from dashboard

  # Incorrect UI terms (do NOT exist in this app)
  forbidden_ui_terms:
    - Side Panel
    - Left Menu
    - Sidebar
    - Navigation Bar
    - Watchlist Page
    - Performance Page

  # Feature notes
  feature_notes:
    p_fill: "P(fill) is an uncalibrated heuristic, not a calibrated probability"
    forecast: "Forecast is the model's fade/ride lean: FADE, RIDE, or STAND_ASIDE (shown as ASIDE)"
    stats: "Stats and Journal populate only after the algo banks its first closed round-trip trade"

  # --- Live UI element extraction (selector grounding for Playwright generation) ---
  ui_extraction:
    enabled: true
    inventory_path: output/gap-forecaster/inventory.json
    backend_url: http://localhost:8000
    # Standalone Page Object Model project generated from the inventory
    pom:
      project_path: /Users/gulzhasmailybayeva/Desktop/gap-trading-forecaster-ui-automation
      run_after_generate: false
    # Backend API responses fulfilled at the network layer so data-driven DOM
    # renders deterministically WITHOUT running the real Python backend.
    api_mocks:
      - url_glob: "**/api/account"
        body_file: projects/fixtures/gap-forecaster/account.json
      - url_glob: "**/api/market"
        body_file: projects/fixtures/gap-forecaster/market.json
      - url_glob: "**/api/scan"
        body_file: projects/fixtures/gap-forecaster/scan.json
      - url_glob: "**/api/stats"
        body_file: projects/fixtures/gap-forecaster/stats.json
    # Tabs are client-side state, reached by scripted role clicks (not routes).
    page_states:
      - name: Scanner
        steps:
          - { kind: goto, target: "/" }
        ready_selector: "text=Ticker"
      - name: Journal
        steps:
          - { kind: goto, target: "/" }
          - { kind: click_role, role: button, name: Journal }
        ready_selector: "text=Trade journal"
      - name: Stats
        steps:
          - { kind: goto, target: "/" }
          - { kind: click_role, role: button, name: Stats }
        ready_selector: "text=Win rate"

# Integration platform configuration
integration:
  platform: ado
  base_url_template: "https://dev.azure.com/{organization}/{project}"
  api_version: "7.1"

ado:
  organization: cdpinc
  project: Env
  area_path: "Env\\ENV Kanda"
  assigned_to: gulzhas.mailybayeva@kandasoft.com
  default_state: Design
  test_suite_pattern: "{story_id} : {story_name}"
  qa_prep_pattern: "Story {story_id}: QA Prep"

rules:
  forbidden_words:
    - "or / OR"
    - "if available"
    - "if supported"
    - "ambiguous"

  forbidden_area_terms:
    - Functionality
    - Behavior
    - Validation
    - General
    - System

  allowed_areas:
    - Header
    - Scanner Tab
    - Journal Tab
    - Stats Tab
    - Scan Button
    - Top Pick Card
    - Scanner Results Table
    - Trade Journal Table
    - Stats Cards
    - Accessibility

  first_test_id: AC1
  test_id_increment: 5

output_dir: output
llm_enabled: true
llm_provider: gemini
llm_model: gemini-2.5-flash

# Automation script generation — ENABLED for this project
playwright_enabled: true
postman_enabled: true

# Objective formatting patterns
objective_patterns:
  - '\bScanner\b'
  - '\bJournal\b'
  - '\bStats\b'
  - '\bScan\b'
  - '\bTop pick\b'
  - '\bForecast\b'
  - '\b(?:FADE|RIDE|STAND_ASIDE|ASIDE)\b'
  - '\b(?:gap up|gap down|gap fill|P\(fill\))\b'
  - '\b(?:win rate|net P/L|profit factor|avg R)\b'
  - '\b(?:Chrome|Firefox|Safari|Edge)\b'
  - '\b(?:enabled|disabled|visible|hidden)\b'
